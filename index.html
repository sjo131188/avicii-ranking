<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avicii - Skapa din egen ranking (Topp 50)</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Georgia', 'Times New Roman', serif; 
            background-color: #0b111e; 
            color: #f0f0f0; 
            padding: 20px;
            margin: 0;
        }
        h1 { 
            text-align: center; 
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #a0b2c6;
            margin-bottom: 25px;
            font-family: sans-serif;
            font-size: 0.95em;
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
        }
        .actions-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button.btn {
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: transform 0.15s, opacity 0.2s;
            font-family: sans-serif;
        }
        button.btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
        .btn-gold {
            background: linear-gradient(135deg, #e5b95f, #c29336);
            color: #121212;
        }
        .btn-dark {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }
        .section-header {
            font-family: sans-serif;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 30px 0 15px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .section-header.poster-zone {
            color: #e5b95f;
            border-color: #e5b95f;
        }
        .section-header.bench-zone {
            color: #94a3b8;
            border-color: #334155;
        }
        .list-group { 
            list-style-type: none; 
            padding: 0; 
            margin: 0;
            min-height: 60px;
        }
        .list-group-item { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(4px);
            margin-bottom: 6px; 
            padding: 12px 18px; 
            border-radius: 6px; 
            cursor: grab; 
            display: flex; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Georgia', serif;
            transition: background-color 0.2s;
        }
        .list-group-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .list-group-item:active { 
            cursor: grabbing; 
        }
        .list-group-item.sortable-ghost {
            opacity: 0.3;
            background-color: #d4af37;
        }
        #benchList .list-group-item {
            opacity: 0.65;
            border-style: dashed;
        }
        #benchList .list-group-item:hover {
            opacity: 1;
        }
        .rank-number { 
            font-weight: bold; 
            margin-right: 15px; 
            color: #c9a050; 
            width: 40px;
            font-size: 1.1em;
        }
        #benchList .rank-number {
            color: #64748b;
        }
        .track-name {
            font-size: 1.05em;
        }
        /* Modal för att visa genererad bild */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal img {
            max-height: 80vh;
            max-width: 90vw;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-buttons {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Avicii Låtranking</h1>
        <p class="subtitle">Dra låtar mellan listorna. De 50 översta låtarna kommer med på affischen!</p>

        <div class="actions-bar">
            <button class="btn btn-gold" onclick="generatePoster()">Skapa Topp 50-affisch</button>
            <button class="btn btn-dark" onclick="exportText()">Spara som text</button>
        </div>
        
        <div class="section-header poster-zone">
            <span>Topp 50 (Kommer med på affischen)</span>
            <span id="topCount">50 / 50</span>
        </div>
        <ul id="rankList" class="list-group"></ul>

        <div class="section-header bench-zone">
            <span>Övriga låtar (Utanför affischen)</span>
            <span id="benchCount">25</span>
        </div>
        <ul id="benchList" class="list-group"></ul>
    </div>

    <!-- Förhandsvisning av affischen -->
    <div id="imageModal" class="modal">
        <img id="posterPreview" alt="Topp 50 Poster">
        <div class="modal-buttons">
            <a id="downloadLink" download="avicii_top_50.png" class="btn btn-gold" style="text-decoration: none; display: inline-block;">Ladda ner bild</a>
            <button class="btn btn-dark" onclick="closeModal()">Stäng</button>
        </div>
    </div>

    <canvas id="posterCanvas" width="1000" height="1500"></canvas>

    <script>
        const initialTracks = [
            "I Could Be the One", "Levels", "Dear Boy", "Waiting for Love", "Seek Bromance",
            "Fade Into Darkness", "Silhouettes", "You Make Me", "Without You", "New New New",
            "Girl Gone Wild", "Sunshine", "All You Need Is Love", "A Sky Full of Stars", "UMF",
            "Blessed", "The Nights", "My Feelings for You", "Dancing in My Head", "Superlove",
            "Sunset Jesus", "Beautiful Heartbeat", "For a Better Day", "Shame on Me", "Hey Brother",
            "City Lights", "True Believer", "Broken Arrows", "Always on the Run", "Wake Me Up",
            "Tough Love", "Rapture", "Back Where I Belong", "X You", "Last Dance",
            "Fades Away", "Gonna Love Ya", "The Days", "Addicted to You", "Somewhere in Stockholm",
            "Can't Catch Me", "Pure Grinding", "Lonely Together", "Heaven", "You Be Love",
            "SOS", "Divine Sorrow", "Forever Yours", "Talk to Myself", "Liar Liar",
            // De sista 25 (hamnar i den undre listan som standard)
            "Lay Me Down", "EDOM", "So Much Better", "Feeling Good", "Taste the Feeling",
            "Speed", "Bad Reputation", "Peace of Mind", "Friend of Mine", "Trouble",
            "Touch Me", "Ten More Days", "Hope There's Someone", "Heart Upon My Sleeve", "Canyons",
            "Hold the Line", "Ain't a Thing", "Freak", "Excuse Me Mr Sir", "What Would I Change It To",
            "Long Road to Hell", "Never Leave Me", "Derezzed", "Insomnia 2.0", "Miami 82"
        ];

        const topListEl = document.getElementById('rankList');
        const benchListEl = document.getElementById('benchList');

        // Rendera de första 50 i topplistan och resterande 25 i bänklistan
        initialTracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.innerHTML = `<span class="rank-number"></span><span class="track-name">${track}</span>`;
            if (index < 50) {
                topListEl.appendChild(li);
            } else {
                benchListEl.appendChild(li);
            }
        });

        // Gör båda listorna sorterbara och kopplade så att man kan dra emellan dem
        const sortableOptions = {
            group: 'avicii-tracks',
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: updateRanks
        };

        Sortable.create(topListEl, sortableOptions);
        Sortable.create(benchListEl, sortableOptions);

        function updateRanks() {
            const topItems = topListEl.getElementsByTagName('li');
            for (let i = 0; i < topItems.length; i++) {
                topItems[i].getElementsByClassName('rank-number')[0].innerText = (i + 1) + '.';
            }

            const benchItems = benchListEl.getElementsByTagName('li');
            for (let j = 0; j < benchItems.length; j++) {
                benchItems[j].getElementsByClassName('rank-number')[0].innerText = '-';
            }

            document.getElementById('topCount').innerText = `${topItems.length} / 50`;
            document.getElementById('benchCount').innerText = benchItems.length;
        }

        function exportText() {
            const topItems = topListEl.getElementsByTagName('li');
            let out = "Avicii Topp 50:\\n\\n";
            for (let i = 0; i < topItems.length; i++) {
                out += `${i + 1}. ${topItems[i].getElementsByClassName('track-name')[0].innerText}\\n`;
            }
            const blob = new Blob([out], { type: "text/plain;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "avicii_topp_50.txt";
            a.click();
        }

        // Rita ut Topp 50 på affischen
        function generatePoster() {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            // 1. Bakgrund: Solnedgång över berg & vatten
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#101e38');
            grad.addColorStop(0.25, '#3b2f4c');
            grad.addColorStop(0.45, '#c85e2b');
            grad.addColorStop(0.6, '#e08b3c');
            grad.addColorStop(0.75, '#162
